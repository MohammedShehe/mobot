name: mobot
description: "MO - a stateless human-robot assistant powered by Groq."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  geolocator: ^13.0.2
  device_calendar: ^4.3.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo_light.png
    - assets/logo_dark.png

# Generate icons with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo_dark.png
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: assets/logo_dark.png
  remove_alpha_ios: true
